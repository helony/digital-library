<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Not found · Kurdish Digital Library</title>
  <script>
    const libraryBase = location.hostname.endsWith('.github.io') ? '/digital-library/' : '/';
    const stylesheet = document.createElement('link');
    stylesheet.rel = 'stylesheet';
    stylesheet.href = libraryBase + 'assets/styles.css';
    document.head.appendChild(stylesheet);
  </script>
</head>
<body>
  <main class="info-page"><div class="shell info-shell">
    <div class="page-kicker">404</div>
    <h1>That page is not in the library.</h1>
    <p class="page-lead">The address may have changed, but the catalogue is still here.</p>
    <a class="primary-button" id="homeLink" href="/">Return to the library</a>
  </div></main>
  <script>document.getElementById('homeLink').href = libraryBase;</script>
</body>
</html>

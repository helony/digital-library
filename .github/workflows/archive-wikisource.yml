name: Archive eligible Wikisource texts

on:
  push:
    paths:
      - .github/workflows/archive-wikisource.yml
      - tools/archive_books.py
      - archive-manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-library
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python3 -m pip install -r requirements-validation.txt
      - name: Save eligible texts and verify checksums
        run: |
          python3 tools/archive_books.py --format=wiki
          python3 tools/verify_library.py --format=wiki
          python3 tools/rebuild_pdf_index.py
          python3 tools/check_library.py --require-pdf-parser --report /tmp/archive-checks.json
      - name: Commit local preservation copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books library-audit.json assets/discovery-utils.js
          if ! git diff --cached --quiet; then
            git commit -m "Archive eligible Wikisource texts"
            git push
          fi

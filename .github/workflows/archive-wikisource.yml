name: Archive eligible Wikisource texts

on:
  push:
    paths:
      - .github/workflows/archive-wikisource.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-wikisource
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Save eligible texts and verify checksums
        run: |
          python3 tools/archive_books.py --format=wiki
          python3 tools/verify_library.py
      - name: Commit local preservation copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books library-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive eligible Wikisource texts"
            git push
          fi

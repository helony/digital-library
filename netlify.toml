[build]
  publish = "_site"
  command = "python3 -m pip install -r requirements-validation.txt && npm ci --ignore-scripts && bash tools/prepublish.sh && python3 tools/prepare_site.py"

[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/books/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
